<script>
{
const L = LEARN;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const done = () => { try { return JSON.parse(localStorage.getItem('inv-learn') || '{}'); } catch { return {}; } };
const prog = c => { const d = done(); return c.lessons.filter((_, i) => d[c.id + ':' + i]).length; };
const LV = { Beginner: 'beg', Intermediate: 'mid', Advanced: 'exp' }, NAME = { beg: 'Beginner', mid: 'Intermediate', exp: 'Expert' };
const SUB = { beg: 'Never invested? Start here.', mid: 'You invest already. Now do it well.', exp: 'Value companies and read the economy.' };
const kOf = c => LV[c.level] || 'beg';
const hm = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60 ? (m % 60) + ' min' : ''}`.trim() : `${m} min`;
const mins = c => c.min || c.lessons.reduce((s, l) => s + (l.min || 0), 0);
const wm = '<span class="wmk">Invested<i>i</i>a</span>';
const mini = (k, course) => `<div class="mini ${k}"><div class="mt">${wm}<img src="assets/img/guidify-${k === 'beg' ? 'black' : 'white'}.png" alt=""></div><div class="mk">${NAME[k]} certificate</div><div class="mn">Your Name</div>${course ? `<div class="mc">${esc(course)}</div>` : ''}</div>`;
// levels (real courses only)
document.getElementById('lvls').innerHTML = ['beg', 'mid', 'exp'].map((k, i) => {
  const cs = L.courses.filter(c => kOf(c) === k), n = cs.reduce((s, c) => s + c.lessons.length, 0), t = cs.reduce((s, c) => s + mins(c), 0);
  const items = cs.map((c, j) => { const p = prog(c), ok = p && p === c.lessons.length; return `<li><a href="lesson.html?c=${esc(c.id)}"><span class="no ${ok ? 'ok' : ''}">${ok ? '✓' : j + 1}</span><b>${esc(c.t)}</b><em>${c.lessons.length} lessons</em></a></li>`; }).join('');
  return `<article class="lv ${k}"><div class="lv-h"><span class="lv-n">${i + 1}</span><div><h3>${NAME[k]}</h3><p>${SUB[k]}</p></div></div>
  <div class="lv-m"><span><b>${cs.length}</b> course${cs.length === 1 ? '' : 's'}</span><span><b>${n}</b> lessons</span>${t ? `<span><b>${hm(t)}</b></span>` : ''}</div>
  <ol>${items}</ol>${cs.length < 5 ? `<div class="soon">More ${NAME[k].toLowerCase()} courses are on the way.</div>` : ''}
  <button type="button" class="lv-c" data-cert="${k}">${mini(k)}<div><b>${NAME[k]} certificate</b><span>After every ${NAME[k].toLowerCase()} course</span><u>View certificate →</u></div></button>
  ${cs[0] ? `<a class="lv-go" href="lesson.html?c=${esc(cs[0].id)}">Start ${NAME[k].toLowerCase()} →</a>` : ''}</article>`;
}).join('');
// catalogue
let lvl = 'all';
const card = (c, i) => { const k = kOf(c), p = prog(c); return `<a class="ck" href="lesson.html?c=${esc(c.id)}"><div class="cv"><span class="ix">Course ${String(i + 1).padStart(2, '0')}</span><span class="lvl">${NAME[k]}</span>${mini(k, c.t)}</div><div class="bd"><h4>${esc(c.t)}</h4><p>${esc(c.d)}</p><div class="m"><span>${c.lessons.length} lessons</span>${mins(c) ? `<span>${mins(c)} min</span>` : ''}</div><div class="ce"><i></i>Certificate when you finish</div>${p ? `<div class="pg"><i style="width:${Math.round(p / c.lessons.length * 100)}%"></i></div>` : ''}</div></a>`; };
const order = [...L.courses].sort((a, b) => ['beg', 'mid', 'exp'].indexOf(kOf(a)) - ['beg', 'mid', 'exp'].indexOf(kOf(b)));
const draw = () => { document.getElementById('cg').innerHTML = order.map((c, i) => [c, i]).filter(([c]) => lvl === 'all' || kOf(c) === lvl).map(([c, i]) => card(c, i)).join(''); };
const nL = L.courses.reduce((s, c) => s + c.lessons.length, 0);
document.getElementById('cat-n').textContent = `${L.courses.length} courses · ${nL} lessons · ${L.glossary.length} terms`;
const f = document.getElementById('lvl');
f.innerHTML = [['all', 'All'], ['beg', 'Beginner'], ['mid', 'Intermediate'], ['exp', 'Expert']].map(([k, t]) => `<button type="button" data-k="${k}" class="${k === 'all' ? 'on' : ''}">${t}</button>`).join('');
f.querySelectorAll('button').forEach(b => b.onclick = () => { lvl = b.dataset.k; f.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
draw();
// tutorials and glossary
const topicOf = k => L.topics.find(t => t.k === k) || {};
document.getElementById('tut').innerHTML = L.tutorials.map(([t, k, m, d]) => `<a href="lesson.html?c=basics"><span><b>${esc(t)}</b><small>${esc(d)}</small></span><em>${esc(m)} min</em></a>`).join('');
document.getElementById('g-n').textContent = `${L.glossary.length} terms`;
const letters = [...new Set(L.glossary.map(g => g[0][0].toUpperCase()))].sort();
let letter = '';
const gloss = () => document.getElementById('gloss').innerHTML = L.glossary.filter(g => !letter || g[0][0].toUpperCase() === letter).map(([t, d]) => `<div><dt>${esc(t)}</dt><dd>${esc(d)}</dd></div>`).join('');
const lt = document.getElementById('letters');
lt.innerHTML = `<button type="button" class="on" data-l="">All</button>` + letters.map(l => `<button type="button" data-l="${l}">${l}</button>`).join('');
lt.querySelectorAll('button').forEach(b => b.onclick = () => { letter = b.dataset.l; lt.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); gloss(); });
gloss();
// search across courses, lessons, tutorials and glossary
const q = document.getElementById('lq');
q.oninput = () => {
  const s = q.value.trim().toLowerCase(), show = s.length > 1;
  document.getElementById('results').hidden = !show; document.getElementById('cat').hidden = show;
  if (!show) return;
  const hits = [];
  L.courses.forEach(c => { if ((c.t + ' ' + c.d).toLowerCase().includes(s)) hits.push(['Course', c.t, c.d, `lesson.html?c=${c.id}`]); c.lessons.forEach((l, i) => { if (l.t.toLowerCase().includes(s)) hits.push(['Lesson', l.t, c.t, `lesson.html?c=${c.id}&l=${i}`]); }); });
  L.tutorials.forEach(([t, k, m, d]) => { if ((t + ' ' + d).toLowerCase().includes(s)) hits.push(['Tutorial', t, d, 'lesson.html?c=basics']); });
  L.glossary.forEach(([t, d]) => { if ((t + ' ' + d).toLowerCase().includes(s)) hits.push(['Glossary', t, d, '#glossary']); });
  document.getElementById('res-t').textContent = `${hits.length} result${hits.length === 1 ? '' : 's'} for “${q.value.trim()}”`;
  document.getElementById('res').innerHTML = hits.map(([k, t, d, h]) => `<a href="${esc(h)}"><small>${k}</small><b>${esc(t)}</b><small>${esc(d)}</small></a>`).join('') || '<p style="color:var(--fg-3)">Nothing yet. Try another word.</p>';
};
document.getElementById('clear').onclick = () => { q.value = ''; q.oninput(); q.focus(); };
addEventListener('keydown', e => { if (e.key === '/' && document.activeElement !== q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); } });
// full certificate previews: same structure, own colour, motif and emblem per level
const IC = { beg: '<path d="M12 21v-8"/><path d="M12 13c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 15c0-3-2.4-5-6-5 0 3 2.4 5 6 5z"/>', mid: '<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>', exp: '<path d="M3 20 10 7l4 7 2-3 5 9z"/><path d="M8.5 10.5 10 12l1.5-1.5"/>' };
function motif(k) {
  let d = '';
  if (k === 'beg') { for (let y = 0; y < 707; y += 22) for (let x = 560; x < 1000; x += 22) { const r = Math.hypot(x - 930, y - 640); if (r < 420) d += `<circle cx="${x}" cy="${y}" r="${(1.6 * (1 - r / 420) + .4).toFixed(2)}" fill="#0a0a0b" opacity="${(.22 * (1 - r / 420) + .03).toFixed(3)}"/>`; } }
  else if (k === 'mid') { for (let i = 0; i < 16; i++) { let p = ''; for (let x = 420; x <= 1000; x += 10) { const y = 150 + i * 28 + Math.sin(x / 90 + i * .5) * 22 + Math.cos(x / 47 + i) * 8; p += (x === 420 ? 'M' : 'L') + x + ' ' + y.toFixed(1); } d += `<path d="${p}" fill="none" stroke="#fff" stroke-opacity="${(.04 + .05 * Math.sin(i / 2) ** 2).toFixed(3)}" stroke-width="1.1"/>`; } }
  else { const cx = 880, cy = 560, R = 330, t = .4; for (let la = -80; la <= 80; la += 6) for (let lo = -180; lo < 180; lo += 6) { const ph = la * Math.PI / 180, lm = lo * Math.PI / 180 + .6, x = Math.cos(ph) * Math.sin(lm), y0 = Math.sin(ph), z0 = Math.cos(ph) * Math.cos(lm), y = y0 * Math.cos(t) - z0 * Math.sin(t), z = y0 * Math.sin(t) + z0 * Math.cos(t); if (z > 0) d += `<circle cx="${(cx + R * x).toFixed(1)}" cy="${(cy - R * y).toFixed(1)}" r="1.1" fill="#fff" opacity="${(.05 + z * .16).toFixed(2)}"/>`; }
    d += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#fff" stroke-opacity=".08"/>`;
    for (const [a, b, c, e] of [[740, 440, 860, 330], [860, 330, 960, 420], [740, 440, 800, 560]]) d += `<path d="M${a} ${b} Q${(a + c) / 2} ${Math.min(b, e) - 60} ${c} ${e}" fill="none" stroke="#FF7A1A" stroke-opacity=".55" stroke-width="1.4"/><circle cx="${c}" cy="${e}" r="3.5" fill="#FF7A1A"/><circle cx="${a}" cy="${b}" r="3.5" fill="#FF7A1A"/>`; }
  return `<svg class="motif" viewBox="0 0 1000 707" aria-hidden="true">${d}</svg>`;
}
function emblem(k) { const n = { beg: 1, mid: 2, exp: 3 }[k], col = k === 'beg' ? '#0a0a0b' : k === 'mid' ? '#fff' : '#FF7A1A'; let r = ''; for (let i = 0; i < n; i++) r += `<circle cx="46" cy="46" r="${42 - i * 7}" fill="none" stroke="${col}" stroke-width="1.4"/>`; return `<svg class="emb" viewBox="0 0 92 92" aria-hidden="true">${r}<svg x="34" y="34" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${col}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg></svg>`; }
function cert(k) { const cs = L.courses.filter(c => kOf(c) === k).map(c => c.t); return `<div class="cf ${k}">${motif(k)}<span class="sample">SAMPLE</span><div class="top">${wm}<img src="assets/img/guidify-${k === 'beg' ? 'black' : 'white'}.png" alt="Guidify"></div>
<p class="lab"><svg viewBox="0 0 24 24">${IC[k]}</svg>${NAME[k]} certificate</p><p class="nm">Your Name</p><p class="cs">has completed the <b>${NAME[k]} level</b> of the Investedia Library${cs.length ? ': ' + esc(cs.join(', ')) : ''}.</p><div class="ln"></div>
<div class="meta"><div>Issued<b>Date of completion</b></div><div>Credential ID<b>INV-L${{ beg: 1, mid: 2, exp: 3 }[k]}-······</b></div><div>Verify<b>investedia.com/verify</b></div>${emblem(k)}</div></div>`; }
const cm = document.getElementById('cm'), ch = document.getElementById('cm-h');
const fit = () => { const c = ch.firstElementChild; if (!c) return; const s = Math.min(1, (innerWidth - 48) / 1000, (innerHeight - 120) / 707); c.style.transform = `scale(${s})`; ch.style.width = 1000 * s + 'px'; ch.style.height = 707 * s + 'px'; };
const open = k => { ch.innerHTML = cert(k); document.querySelectorAll('#cm-t button').forEach(b => b.classList.toggle('on', b.dataset.l === k)); cm.classList.add('on'); fit(); };
const close = () => cm.classList.remove('on');
document.querySelectorAll('[data-cert]').forEach(e => e.addEventListener('click', () => open(e.dataset.cert)));
document.querySelectorAll('#cm-t button').forEach(b => b.addEventListener('click', () => open(b.dataset.l)));
document.getElementById('cm-x').addEventListener('click', close); cm.addEventListener('click', e => { if (e.target === cm) close(); });
addEventListener('keydown', e => { if (e.key === 'Escape') close(); }); addEventListener('resize', fit);
if (UI.routeHash) UI.routeHash({});
}
</script>
