<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Investedia Globe</title>
<meta name="description" content="Market activity on one globe: live financial news pinned where it happens.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0B">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<!-- Globe app (owner 27 Nov 2026). Full screen, no site header. Design B: search, News | Projects, filters,
     story card on the pin (draggable), latest feed (big moves and big brands first), timeline scrubber,
     layout menu (screenshot, share, split screens, performance mode). Globes are the existing globe page in embed mode. -->
<style>
@font-face{font-family:Inter;src:url(../fonts/inter-var.woff2) format("woff2");font-display:swap}
:root{--bg:#070708;--p:rgba(18,18,21,.72);--ln:rgba(255,255,255,.1);--ln2:rgba(255,255,255,.16);--tx:#f4f4f5;--t2:#a1a1aa;--t3:#6b6b74;--or:#ff7a1a;--up:#3ccf8e;--dn:#ff5a52}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--p);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--ln)}
.btn{height:42px;min-width:42px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px}
.btn.ic{padding:0}
a.btn{color:var(--tx);text-decoration:none}
.btn:hover{border-color:var(--ln2)}
.k{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--or)}
.mu{color:var(--t2)}.m3{color:var(--t3)}.up{color:var(--up)}.dn{color:var(--dn)}
/* screens */
#screens{position:fixed;inset:0;display:grid;gap:2px;background:#1c1c21}
#screens.l1{grid-template-columns:1fr}
#screens.l2{grid-template-columns:var(--split,50%) 1fr}
#div{position:fixed;top:0;bottom:0;width:12px;margin-left:-6px;z-index:9;cursor:col-resize;display:none;touch-action:none}
#div::after{content:"";position:absolute;left:5px;top:50%;width:2px;height:44px;margin-top:-22px;border-radius:2px;background:rgba(255,255,255,.45)}
body.split #div{display:block}
.pane{position:relative;background:var(--bg);overflow:hidden;min-width:0}
.pane iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pane.on{outline:1.5px solid rgba(255,255,255,.55);outline-offset:-1.5px}
.ph{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;gap:6px}
.ph select{appearance:none;height:30px;padding:0 10px;border-radius:8px;color:var(--tx);font:inherit;font-size:12px;cursor:pointer}
#screens.l1 .ph{display:none}
/* top bar */
#top{position:fixed;left:16px;right:16px;top:14px;z-index:20;display:flex;gap:8px;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#q{flex:0 1 380px;display:flex;align-items:center;gap:10px;height:42px;padding:0 16px;border-radius:999px;position:relative}
#q input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:14px}
#q input::placeholder{color:var(--t3)}
#qr{position:absolute;left:0;right:0;top:48px;border-radius:14px;padding:6px;display:none;max-height:60vh;overflow:auto}
#qr.on{display:block}
#qr button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13px}
#qr button:hover,#qr button.on{background:rgba(255,255,255,.08)}
.seg{display:flex;padding:4px;border-radius:999px;gap:2px}
.seg button{height:34px;padding:0 15px;border-radius:999px;font-size:13.5px;color:var(--t2)}
.seg button[aria-pressed=true]{background:var(--tx);color:#0a0a0a;font-weight:600}
#chips{position:fixed;left:16px;top:66px;z-index:19;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 400px)}
.chip{height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--t2)}
.chip[aria-pressed=true]{background:var(--tx);color:#0a0a0a;font-weight:600;border-color:var(--tx)}
.sp{flex:1}
/* layout menu */
#menu{position:fixed;right:16px;top:62px;z-index:30;width:280px;border-radius:16px;padding:8px;display:none}
#menu.on{display:block}
#menu h6{font-size:10.5px;letter-spacing:.12em;color:var(--t3);font-weight:600;padding:8px 10px 4px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:13.5px;text-align:left}
.mi:hover{background:rgba(255,255,255,.07)}
.mi small{margin-left:auto;color:var(--t3);font-size:11px}
.pro{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--or);border:1px solid rgba(255,122,26,.5);border-radius:5px;padding:1px 5px;display:inline-flex;align-items:center;gap:3px}
.pro svg{width:10px;height:10px}
.lays{display:flex;gap:6px;padding:4px 10px 8px}
.lay{width:52px;height:38px;border-radius:7px;border:1px solid var(--ln2);position:relative;display:grid;place-items:center}
.lay[aria-pressed=true]{border-color:var(--tx);background:rgba(255,255,255,.08)}
.lay .pro{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--bg)}
.tg{width:34px;height:20px;border-radius:99px;background:#2c2c32;position:relative;margin-left:auto;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8a8a92;transition:left .15s}
.tg.on{background:var(--or)}.tg.on::after{left:16px;background:#fff}
/* feed */
#feed{position:fixed;right:16px;top:118px;bottom:112px;width:330px;z-index:15;border-radius:18px;display:flex;flex-direction:column;overflow:hidden}
#feed header{display:flex;align-items:center;gap:8px;padding:12px 14px 8px}
#feed header b{font-size:14px}
.mini{display:flex;padding:3px;border-radius:9px;background:rgba(255,255,255,.06);margin-left:auto}
.mini button{padding:3px 8px;border-radius:7px;font-size:11.5px;color:var(--t2)}
.mini button[aria-pressed=true]{background:var(--tx);color:#0a0a0a;font-weight:600}
#feed .sub{padding:0 14px 6px;font-size:11px;color:var(--t3)}
#list{overflow:auto;flex:1}
.it{display:block;width:100%;text-align:left;padding:11px 14px;border-top:1px solid var(--ln)}
.it:hover{background:rgba(255,255,255,.04)}
.it .tp{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);gap:8px}
.it .tp b{font-weight:700;letter-spacing:.06em;color:var(--t2);text-transform:uppercase}
.it .tp .big{color:var(--or)}
.it h4{font-size:13px;font-weight:550;margin:4px 0 3px;line-height:1.32}
.it.big h4{font-weight:650}
.it .mv{font-size:11.5px}
#feed.cards{top:auto;left:16px;right:16px;bottom:112px;width:auto;height:168px}
#feed.cards #list{display:flex;gap:10px;overflow-x:auto;padding:0 12px 12px}
#feed.cards .it{flex:0 0 260px;border:1px solid var(--ln);border-radius:14px}
/* story card */
#card{position:fixed;z-index:25;width:320px;border-radius:18px;padding:14px 16px 16px;display:none;box-shadow:0 20px 60px rgba(0,0,0,.55)}
#card.on{display:block}
#card.in{animation:cin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes cin{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#card.in{animation:none}}
#card .grip{display:block;margin:-6px auto 6px;width:40px;height:14px;cursor:grab;color:var(--t3);text-align:center;font-size:12px;letter-spacing:2px;touch-action:none}
#card h3{font-size:17px;line-height:1.24;margin:8px 0;font-weight:650;letter-spacing:-.01em}
#card p{font-size:13px;line-height:1.5;color:var(--t2)}
#card .why{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln)}
#card .row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--ln);font-size:13px}
#card .row:first-child{border:0}
#card .act{display:flex;gap:8px;margin-top:12px}
#card .act a{flex:1;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;gap:6px;color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;background:rgba(44,44,50,.7);border:1px solid var(--ln2)}
#card .x{position:absolute;right:10px;top:10px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--t2)}
#card .src{margin-top:10px;font-size:10.5px;color:var(--t3)}
#card .nav{display:flex;gap:6px;margin-top:8px}
#card .nav button{font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--ln)}
#line{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:24;pointer-events:none}
/* timeline */
#tl{position:fixed;left:16px;right:362px;bottom:16px;z-index:15;border-radius:16px;padding:12px 16px}
#tl .hd{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:10px}
#tl .hd b{font-size:13px}
#play{width:30px;height:30px;border-radius:50%;background:var(--tx);color:#0a0a0a;display:grid;place-items:center}
#play svg{width:13px;height:13px;fill:#0a0a0a;stroke:none}
#bar{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none}
#bar .tr{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:#2a2a30}
#bar .free{position:absolute;right:0;top:9px;height:4px;border-radius:2px;background:var(--or)}
#bar .kn{position:absolute;top:3px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#tl .lb{display:flex;justify-content:space-between;font-size:10.5px;color:var(--t3);margin-top:4px}

/* toolkit (vertical or horizontal, collapsible, draggable by its grip) */
#kit{position:fixed;left:16px;top:118px;z-index:18;border-radius:14px;padding:4px;display:flex;flex-direction:column;gap:2px;align-items:center}
#kit.h{flex-direction:row}
#kit .g{width:34px;height:16px;cursor:grab;color:var(--t3);font-size:10px;letter-spacing:2px;display:grid;place-items:center;touch-action:none}
#kit.h .g{width:16px;height:34px;writing-mode:vertical-rl}
#kit .t{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;position:relative;color:var(--tx)}
#kit .t:hover{background:rgba(255,255,255,.07)}
#kit .t[aria-pressed=true]{background:rgba(255,255,255,.14)}
#kit .t .cr{position:absolute;right:3px;bottom:3px;border-left:4px solid transparent;border-bottom:4px solid #8a8a92}
#kit .sp2{width:22px;height:1px;background:var(--ln);margin:3px 0}
#kit.h .sp2{width:1px;height:22px;margin:0 3px}
#kit.col>:not(.g):not(#kTool){display:none}
#fly{position:fixed;z-index:31;width:200px;border-radius:12px;padding:6px;display:none}
#fly.on{display:block}
#fly h6{font-size:10px;letter-spacing:.12em;color:var(--t3);padding:4px 8px}
#draw{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:12;pointer-events:none}
#draw.act{pointer-events:auto;cursor:crosshair}
#draw text{font:600 12px Inter,sans-serif;fill:#fff}
/* feed tabs */
.tabs{display:flex;gap:2px;padding:3px;border-radius:10px;background:rgba(255,255,255,.06)}
.tabs button{padding:4px 10px;border-radius:7px;font-size:12px;color:var(--t2)}
.tabs button[aria-pressed=true]{background:var(--tx);color:#0a0a0a;font-weight:600}
.ev{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--ln);align-items:flex-start}
.ev .d{width:56px;flex:none;font-size:12px;color:var(--or)}
.ev .d small{display:block;color:var(--t3);font-size:10.5px}
.ev h4{font-size:13px;font-weight:600;line-height:1.3}
.ev .s{font-size:11px;color:var(--t3)}
.ev .imp{font-size:8px;color:var(--or);letter-spacing:1px}
.ev .bell{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--t2)}
.ev .bell[aria-pressed=true]{color:var(--or)}
.dh{padding:10px 14px 4px;font-size:10.5px;letter-spacing:.1em;color:var(--t3);text-transform:uppercase}
.wr{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 14px;border-top:1px solid var(--ln);font-size:13px}
.wr small{color:var(--t3);font-size:10.5px;margin-left:4px}
.empty{padding:16px 14px;color:var(--t3);font-size:13px;line-height:1.5}

/* projects */
#proj{position:fixed;inset:0;z-index:11;pointer-events:none}
#proj i{position:absolute;border-radius:50%;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%)}
#plegend{position:fixed;left:16px;bottom:112px;z-index:15;border-radius:12px;padding:7px 12px;font-size:12px;display:none;gap:12px}
body.proj #plegend{display:flex}
body.proj #chips [data-cat]{display:none}
#pchips{display:none}
body.proj #pchips{display:contents}
/* pro inline card */
#pro{position:fixed;left:50%;bottom:122px;transform:translateX(-50%);z-index:40;width:min(440px,calc(100% - 24px));border-radius:16px;padding:14px 16px;display:none}
#pro.on{display:block}
#pro b{font-size:14px;display:flex;align-items:center;gap:8px}
#pro p{font-size:12.5px;color:var(--t2);margin:6px 0 10px}
#pro .a{display:flex;gap:8px}
#pro .a a{padding:8px 16px;border-radius:999px;background:var(--tx);color:#0a0a0a;font-weight:600;font-size:13px;text-decoration:none}
#pro .a button{padding:8px 6px;font-size:13px;color:var(--t2)}
/* alerts on the card */
#alrt{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--ln);display:none}
#alrt.on{display:block}
#alrt .row button{width:34px;height:20px;border-radius:99px;background:#2c2c32;position:relative}
#alrt .row button::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#8a8a92}
#toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);z-index:40;padding:9px 14px;border-radius:12px;font-size:13px;display:none}
#toast.on{display:block}
.na{position:fixed;left:16px;bottom:2px;z-index:14;font-size:9.5px;color:var(--t3)}
@media (max-width:820px){
  /* phone (owner 28 Nov 2026): top bar · chips · News|Projects + tools on one row · globe · feed as a bottom sheet; timeline behind a button */
  #q{flex:1}#top .seg{display:none}#chips{top:62px;left:12px;right:12px;max-width:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#chips::-webkit-scrollbar{display:none}
  #top{left:12px;right:12px;top:12px}
  #mseg{display:flex!important;top:100px;left:12px}
  #kit{top:100px!important;left:auto!important;right:12px;flex-direction:row}
  #kit .g{display:none}#kit .sp2{width:1px;height:22px;margin:0 3px}
  #feed,#feed.cards{left:0;right:0;bottom:0;top:auto;width:auto;height:34vh;border-radius:20px 20px 0 0;transition:height .25s ease}
  #feed.big{height:72vh}
  #feed::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:#4a4a50;margin:8px auto 0;flex:none}
  #feed .mini{display:none!important}
  #tl{display:none;left:12px;right:12px;bottom:calc(34vh + 56px)}
  body.tl #tl{display:block}
  #tlBtn{display:flex!important}
  #card{left:0!important;right:0;top:auto!important;bottom:0;width:auto;max-height:64vh;overflow:auto;border-radius:20px 20px 0 0}
  body.card #feed,body.card #tl,body.card #tlBtn{display:none!important}
  #card .why{display:none}#card .grip{display:none}
  #plegend{display:none!important}
  .na{display:none}
  #pro{bottom:calc(34vh + 12px)}
}
#mseg{display:none;position:fixed;left:16px;top:104px;z-index:19}
</style>
</head>
<body>
<div id="screens" class="l1"></div><div id="div" role="separator" aria-label="Resize screens"></div>
<svg id="line"><line id="ln" stroke="#ff7a1a" stroke-width="1.2" stroke-dasharray="4 4" /><circle id="lp" r="4" fill="#fff"/></svg>

<div id="proj"></div><svg id="draw"></svg>
<div id="plegend" class="glass"></div>
<div id="pro" class="glass" role="dialog" aria-label="Pro"><b><svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px;color:var(--or)"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span id="proT"></span></b><p id="proP"></p><div class="a"><a href="/pricing">See Pro</a><button id="proX">Not now</button></div></div>
<div id="kit" class="glass" role="toolbar" aria-label="Drawing tools"><span class="g" id="kg" title="Drag to move">· · ·</span><button class="t" id="kTool" aria-label="Show or hide tools" title="Tools"><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><path d="M17 14v6M14 17h6"/></svg></button><button class="t" data-tool="cur" aria-pressed="true" title="Select"><svg class="i" viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg></button><button class="t" data-tool="dist" data-fly="measure" aria-pressed="false" title="Measure (D)"><svg class="i" viewBox="0 0 24 24"><path d="M4 16L16 4l4 4L8 20z"/><path d="M8 12l2 2M11 9l2 2"/></svg><i class="cr"></i></button><button class="t" data-tool="pen" aria-pressed="false" title="Draw (P)"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg></button><button class="t" data-tool="pin" aria-pressed="false" title="Pin a place"><svg class="i" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v8"/></svg></button><button class="t" data-tool="note" aria-pressed="false" title="Add a note"><svg class="i" viewBox="0 0 24 24"><path d="M5 5h14v10h-8l-4 4v-4H5z"/></svg></button><i class="sp2"></i><button class="t" id="kHide" aria-pressed="false" title="Hide drawings"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="t" id="kLock" aria-pressed="false" title="Lock drawings"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button><button class="t" id="kBin" title="Delete all drawings"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg></button></div>
<div id="fly" class="glass" role="menu"><h6>MEASURE</h6><button class="mi" data-m="dist">Distance<small>D</small></button><button class="mi" data-m="radius">Radius<small>R</small></button><h6>ALERT</h6><button class="mi" data-m="alert">Alert for an area<small>PRO</small></button></div>
<div id="top">
  <a class="btn ic glass" id="exit" href="/" aria-label="Exit globe" title="Exit globe"><svg class="i" viewBox="0 0 24 24"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 8l4 4-4 4M19 12H9"/></svg></a>
  <div id="q" class="glass"><svg class="i" viewBox="0 0 24 24" style="color:var(--t3)"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="qi" placeholder="Search news, companies, countries" autocomplete="off" aria-label="Search"><div id="qr" class="glass" role="listbox"></div></div>
  <div class="seg glass" role="group" aria-label="Globe view"><button data-mode="news" aria-pressed="true">News</button><button data-mode="projects" aria-pressed="false">Projects</button></div>
  <span class="sp"></span>
  <button class="btn ic glass" id="menuBtn" aria-label="Layout menu" aria-expanded="false" title="Layout"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="16" rx="1.5"/><rect x="13" y="4" width="8" height="7" rx="1.5"/><rect x="13" y="13" width="8" height="7" rx="1.5"/></svg></button>
</div>
<div id="mseg" class="seg glass" role="group" aria-label="Globe view (phone)"><button data-mode="news" aria-pressed="true">News</button><button data-mode="projects" aria-pressed="false">Projects</button></div>
<div id="chips" role="group" aria-label="Category"></div>

<div id="menu" class="glass" role="menu">
  <h6>LAYOUT</h6>
  <div class="lays" id="lays"></div>
  <h6>VIEW</h6>
  <button class="mi" id="shot" role="menuitem"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8.5 7l1.5-3h4l1.5 3"/></svg>Screenshot<small>PNG</small></button>

  <div class="hd"><button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg></button><b>Timeline</b><span class="mu" id="tlLab"></span><span class="sp"></span><span class="pro" title="Pro" style="cursor:pointer" onclick="document.getElementById('pro').classList.add('on');document.getElementById('proT').textContent='Go further back in time with Pro';document.getElementById('proP').textContent='Free shows the last 30 days. Pro opens every day back to 2016.'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>PRO · back to 2016</span></div>

</section>

  <div id="cb"></div>
</article>
<div id="toast" class="glass" role="status"></div>
<div class="na">Not investment advice · sources on every story</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
const Q = new URLSearchParams(location.search);
const FREE_SCREENS = 2;       // free plan: up to 2 screens (owner may change to 3)
const FREE_DAYS = 30;         // free plan timeline: last 30 days
const S = { stories: [], byId: {}, prices: {}, mode: 'news', cat: 'all', days: 2, sel: null, win: null, layout: 1, perf: store('inv-globe-perf') === '1' || Q.get('perf') === '1' };
const CATS = [['all', 'All'], ['markets', 'Markets'], ['commodities', 'Commodities'], ['economy', 'Economy'], ['companies', 'Companies'], ['crypto', 'Crypto'], ['geopolitics', 'Geopolitics'], ['technology', 'Technology']];
const REG = [['global', 'Global', -15, 24, 1], ['na', 'North America', -97, 40, 2], ['latam', 'Latin America', -62, -16, 1.8], ['eu', 'Europe', 10, 50, 2.6], ['me', 'Middle East', 46, 26, 2.8], ['af', 'Africa', 20, 3, 1.8], ['asia', 'Asia', 108, 28, 1.8], ['oc', 'Oceania', 140, -26, 2]];
const ago = t => { const m = Math.max(0, Math.round((Date.now() - Date.parse(t)) / 6e4)); return m < 60 ? m + 'm' : m < 1440 ? Math.round(m / 60) + 'h' : Math.round(m / 1440) + 'd'; };
const toast = t => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 2200); };

// ---------- screens (each one is the existing globe page in embed mode) ----------
function src() { return 'news.html?embed=1&app=1&cx=.5&cy=.5&r=.40' + (S.perf ? '&perf=1' : '') + (S.mode === 'projects' ? '&mode=projects' : ''); }
function buildScreens() {
  const box = $('screens'); box.className = 'l' + S.layout; box.innerHTML = '';
  document.body.classList.toggle('split', S.layout === 2 && innerWidth > 820); placeDiv();
  for (let i = 0; i < S.layout; i++) {
    const p = document.createElement('div'); p.className = 'pane' + (i === 0 ? ' on' : '');
    p.innerHTML = `<iframe title="Globe ${i + 1}" src="${src()}"></iframe><div class="ph"><select class="glass" aria-label="Region for screen ${i + 1}">${REG.map(r => `<option value="${r[0]}"${(i === 1 ? 'eu' : 'global') === r[0] ? ' selected' : ''}>${r[1]}</option>`).join('')}</select></div>`;
    p.addEventListener('pointerdown', () => { document.querySelectorAll('.pane').forEach(x => x.classList.toggle('on', x === p)); });
    const sel = p.querySelector('select'), fr = p.querySelector('iframe');
    sel.onchange = () => flyRegion(fr, sel.value);
    fr.addEventListener('load', () => { if (i === 1) setTimeout(() => flyRegion(fr, 'eu'), 800); });
    box.appendChild(p);
  }
}
function placeDiv() { const v = parseFloat(store('inv-split') || '50'); $('screens').style.setProperty('--split', v + '%'); $('div').style.left = v + '%'; }
{ const d = $('div'); d.addEventListener('pointerdown', e => { d.setPointerCapture(e.pointerId); document.querySelectorAll('#screens iframe').forEach(f => f.style.pointerEvents = 'none'); });
  d.addEventListener('pointermove', e => { if (!d.hasPointerCapture(e.pointerId)) return; const v = Math.max(25, Math.min(75, e.clientX / innerWidth * 100)); store('inv-split', v.toFixed(1)); placeDiv(); });
  d.addEventListener('pointerup', () => { document.querySelectorAll('#screens iframe').forEach(f => f.style.pointerEvents = ''); frames().forEach(f => f.contentWindow?.dispatchEvent(new Event('resize'))); }); }
function flyRegion(fr, key) { const r = REG.find(x => x[0] === key); try { fr.contentWindow.flyTo(r[2], r[3], r[4]); } catch (e) {} }
function frames() { return [...document.querySelectorAll('#screens iframe')]; }
function setMode(m) {
  S.mode = m; document.body.classList.toggle('proj', m === 'projects'); document.querySelector('#feed .tabs').style.display = m === 'projects' ? 'none' : ''; MINI.style.display = m === 'projects' ? 'none' : ''; document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  frames().forEach(f => f.contentWindow?.postMessage({ type: 'investedia-mode', mode: m }, location.origin));
  closeCard(); if (m === 'projects') showProjects(); else renderTab();
}

// ---------- story card on the pin (draggable; a line stays attached to the pin) ----------
let dragged = null;
window.InvGlobeApp = {
  story(s, win) { focusStory(s, win); openStory(s, win); },
  place(list, win) { if (list && list.length) openStory(list[0], win, list); }
};
function priceOf(imp) { const t = imp && (imp.ticker || (imp.asset && imp.asset.px)); return t && S.prices[t] ? S.prices[t] : null; }
function impactRow(i) {
  const p = priceOf(i); const dir = i.direction === 'up' ? '▲' : i.direction === 'down' ? '▼' : '•';
  const cls = i.direction === 'up' ? 'up' : i.direction === 'down' ? 'dn' : 'm3';
  const v = p && Number.isFinite(p.d) ? `<span class="${p.d >= 0 ? 'up' : 'dn'}">${p.d >= 0 ? '▲ +' : '▼ '}${p.d.toFixed(1)}% today</span>` : `<span class="${cls}">${dir} ${i.direction === 'unclear' ? 'Unclear' : 'Expected'}</span>`;
  return `<div class="row"><span>${esc(i.name)}</span>${v}</div>`;
}
function openStory(s, win, list) {
  S.sel = s; S.win = win || frames()[0]?.contentWindow; S.list = list || null;
  const imp = (s.impacts || []).slice(0, 3);
  $('cb').innerHTML = `<div class="k">${esc(s.category)} · ${esc(s.location?.place || s.location?.country || '')}</div>
    <h3>${esc(s.headline)}</h3><p>${esc(s.summary || '')}</p>
    ${s.why ? `<div class="why"><div class="k" style="margin-bottom:4px">Why it matters</div><p style="color:var(--tx)">${esc(s.why)}</p></div>` : ''}
    ${imp.length ? `<div style="margin-top:10px">${imp.map(impactRow).join('')}</div>` : ''}
    ${list && list.length > 1 ? `<div class="nav"><button data-n="-1">Previous</button><button data-n="1">Next</button><span class="m3" style="font-size:12px;align-self:center">${list.indexOf(s) + 1} of ${list.length} here</span></div>` : ''}
    <div class="act"><a href="/story?id=${encodeURIComponent(s.id)}">Open article <svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px"><path d="M7 17 17 7M9 7h8v8"/></svg></a></div>
    <div class="src">${esc(s.source?.name || '')} · ${new Date(s.published_at).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })} · Not investment advice</div>`;
  { const a = $('cb').querySelector('.act'); a.insertAdjacentHTML('beforeend', alertBlock(s).split('<div id="alrt">')[0]); a.insertAdjacentHTML('afterend', '<div id="alrt">' + alertBlock(s).split('<div id="alrt">')[1]); $('abtn').onclick = () => $('alrt').classList.toggle('on'); $('alrt').querySelectorAll('.row button').forEach(b => b.onclick = () => pro('alerts')); }
  $('cb').querySelectorAll('[data-n]').forEach(b => b.onclick = () => { const L = S.list, k = (L.indexOf(S.sel) + +b.dataset.n + L.length) % L.length; openStory(L[k], S.win, L); });
  const cd = $('card'); cd.classList.remove('in'); void cd.offsetWidth; cd.classList.add('on', 'in'); document.body.classList.add('card'); dragged = null; track();
  history.replaceState(null, '', '?story=' + encodeURIComponent(s.id) + (S.layout > 1 ? '&layout=' + S.layout : ''));
}
function pinXY() {
  const s = S.sel, w = S.win; if (!s || !w || !w.InvGlobeXY) return null;
  const fr = frames().find(f => f.contentWindow === w); if (!fr) return null;
  const r = fr.getBoundingClientRect(); const p = w.InvGlobeXY(s.location.lat, s.location.lon);
  if (!p || p[2] <= 0) return null; return { x: r.left + p[0], y: r.top + p[1] };
}
function track() {
  cancelAnimationFrame(track.raf);
  const c = $('card'); if (!c.classList.contains('on')) { $('line').style.display = 'none'; return; }
  const p = pinXY(), ph = innerWidth <= 820;
  if (!dragged) {
    if (ph) { c.style.left = ''; c.style.top = ''; }
    else if (p) { const x = Math.min(innerWidth - 700, Math.max(16, p.x - 360)), y = Math.min(innerHeight - c.offsetHeight - 130, Math.max(118, p.y - 60)); c.style.left = x + 'px'; c.style.top = y + 'px'; }
  }
  if (p) { const r = c.getBoundingClientRect(), cx = p.x < r.left ? r.left : p.x > r.right ? r.right : r.left + r.width / 2, cy = Math.min(r.bottom, Math.max(r.top, p.y));
    $('line').style.display = ''; const l = $('ln'); l.setAttribute('x1', p.x); l.setAttribute('y1', p.y); l.setAttribute('x2', cx); l.setAttribute('y2', cy); $('lp').setAttribute('cx', p.x); $('lp').setAttribute('cy', p.y);
  } else $('line').style.display = 'none';
  track.raf = requestAnimationFrame(track);
}
function closeCard() { camBack(); setTimeout(paintMini, 0); document.body.classList.remove('card'); $('card').classList.remove('on'); S.sel = null; $('line').style.display = 'none'; history.replaceState(null, '', location.pathname); }
$('cx').onclick = closeCard;
{ const g = $('grip'), c = $('card'); let ox, oy;
  g.addEventListener('pointerdown', e => { g.setPointerCapture(e.pointerId); const r = c.getBoundingClientRect(); ox = e.clientX - r.left; oy = e.clientY - r.top; dragged = true; });
  g.addEventListener('pointermove', e => { if (!g.hasPointerCapture(e.pointerId)) return; c.style.left = Math.max(0, Math.min(innerWidth - 60, e.clientX - ox)) + 'px'; c.style.top = Math.max(0, Math.min(innerHeight - 40, e.clientY - oy)) + 'px'; });
}

// ---------- feed: newest first, but big moves and big companies on top ----------
const isBig = s => !!(S.own && S.own[s.id]);  // only the story that owns a real ≥3% move earns the tag
const brand = s => (s.impacts || []).some(i => i.kind === 'company' && priceOf(i));
function visible() {
  const cut = Date.now() - S.days * 864e5;
  return S.stories.filter(s => (S.cat === 'all' || s.category === S.cat) && Date.parse(s.published_at) >= cut);
}
// one story per moving asset gets the tag and the % (owner 28 Nov 2026): the most important, then the newest
function moveOwners(list) { const own = {}; for (const s of list) for (const i of s.impacts || []) { const t = i.ticker || i.asset?.px, p = priceOf(i); if (!t || !p || !Number.isFinite(p.d) || Math.abs(p.d) < 3) continue; const o = own[t]; if (!o || s.importance > o.importance || (s.importance === o.importance && Date.parse(s.published_at) > Date.parse(o.published_at))) own[t] = s; } const m = {}; for (const [t, s] of Object.entries(own)) (m[s.id] = m[s.id] || []).push(t); return m; }
function renderFeed() {
  S.own = moveOwners(visible());
  const L = visible().map(s => ({ s, b: isBig(s), br: brand(s) })).sort((a, b) => (b.b - a.b) || ((b.s.importance >= 3) - (a.s.importance >= 3)) || (b.br - a.br) || (Date.parse(b.s.published_at) - Date.parse(a.s.published_at)));
  $('cnt').textContent = L.length + ' stories';
  $('list').innerHTML = L.slice(0, 80).map(({ s, b }) => { const im = s.impacts || [], ow = (S.own && S.own[s.id]) || [], i = im.find(x => ow.includes(x.ticker || x.asset?.px)) || im[0], p = ow.length ? priceOf(i) : null;
    const mv = p && Number.isFinite(p.d) ? `<span class="${p.d >= 0 ? 'up' : 'dn'}">${p.d >= 0 ? '▲ +' : '▼ '}${p.d.toFixed(1)}% · ${esc(i.name)}</span>` : i ? `<span class="m3">${esc(i.name)}</span>` : '';
    return `<button class="it${b ? ' big' : ''}" data-id="${esc(s.id)}"><div class="tp"><b>${esc(s.category)}${b ? ' <span class="big">· Big move</span>' : ''}</b><span>${esc(s.location?.place || '')} · ${ago(s.published_at)}</span></div><h4>${esc(s.headline)}</h4><div class="mv">${mv}</div></button>`; }).join('') || '<p class="m3" style="padding:14px">No stories in this window.</p>';
}
$('list').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (!b) return; const s = S.byId[b.dataset.id]; const w = document.querySelector('.pane.on iframe')?.contentWindow || frames()[0].contentWindow;
  focusStory(s, w); openStory(s, w); });
document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { document.querySelectorAll('[data-fs]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('feed').classList.toggle('cards', b.dataset.fs === 'cards'); store('inv-app-feed', b.dataset.fs); });

// ---------- filters ----------
$('chips').innerHTML = CATS.map(([k, t]) => `<button class="chip glass" data-cat="${k}" aria-pressed="${k === 'all'}">${t}</button>`).join('');
$('chips').onclick = e => { const b = e.target.closest('[data-cat]'); if (!b) return; S.cat = b.dataset.cat; $('chips').querySelectorAll('[data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderTab(); };

// ---------- search ----------
$('qi').addEventListener('input', () => { const t = $('qi').value.trim().toLowerCase(), r = $('qr');
  if (t.length < 2) { r.classList.remove('on'); return; }
  const hits = S.stories.filter(s => (s.headline + ' ' + (s.location?.country || '') + ' ' + (s.impacts || []).map(i => i.name).join(' ')).toLowerCase().includes(t)).slice(0, 8);
  r.innerHTML = hits.map(s => `<button data-id="${esc(s.id)}">${esc(s.headline)}<div class="m3" style="font-size:11px">${esc(s.location?.country || '')} · ${ago(s.published_at)}</div></button>`).join('') || '<div class="m3" style="padding:8px 10px;font-size:13px">No matches in the live feed</div>';
  r.classList.add('on'); });
$('qr').onclick = e => { const b = e.target.closest('[data-id]'); if (!b) return; $('qr').classList.remove('on'); $('qi').value = ''; const s = S.byId[b.dataset.id], w = activeWin(); focusStory(s, w); openStory(s, w); };
addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('qi').focus(); } if (e.key === 'Escape') { $('qr').classList.remove('on'); $('menu').classList.remove('on'); if ($('card').classList.contains('on') && K.tool === 'cur') closeCard(); } });

// ---------- timeline (free: last 30 days; Pro: back to 2016) ----------
const T0 = Date.parse('2016-01-01'), span = () => Date.now() - T0;
function setDays(d) { S.days = Math.max(1, Math.min(FREE_DAYS, Math.round(d))); const pct = 100 - S.days * 864e5 / span() * 100; $('kn').style.left = pct + '%'; $('tlLab').textContent = 'Showing the last ' + (S.days === 1 ? '24 hours' : S.days + ' days'); if ($('tlBtn')) $('tlBtn').lastChild.textContent = S.days === 1 ? 'Last 24 hours' : 'Last ' + S.days + ' days'; if (S.tab === 'latest') renderFeed(); }
$('free').style.width = (FREE_DAYS * 864e5 / span() * 100) + '%';
$('lbMid').textContent = 'Free: last ' + FREE_DAYS + ' days';
{ const bar = $('bar'); const at = e => { const r = bar.getBoundingClientRect(), f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), d = (1 - f) * span() / 864e5; if (d > FREE_DAYS) { pro('time'); setDays(FREE_DAYS); } else setDays(d); };
  bar.addEventListener('pointerdown', e => { bar.setPointerCapture(e.pointerId); at(e); }); bar.addEventListener('pointermove', e => { if (bar.hasPointerCapture(e.pointerId)) at(e); }); }
$('play').onclick = () => { let d = FREE_DAYS; clearInterval(setDays.p); setDays.p = setInterval(() => { setDays(d); d -= 1; if (d < 1) clearInterval(setDays.p); }, 250); };

// ---------- layout menu: layouts, screenshot, share, performance mode ----------
$('menuBtn').onclick = e => { e.stopPropagation(); const on = $('menu').classList.toggle('on'); $('menuBtn').setAttribute('aria-expanded', String(on)); };
document.addEventListener('click', e => { if (!e.target.closest('#menu')) $('menu').classList.remove('on'); if (!e.target.closest('#q')) $('qr').classList.remove('on'); });
const LAYS = [[1, '<rect x="5" y="5" width="14" height="10" rx="1" fill="none" stroke="currentColor"/>'], [2, '<rect x="3" y="5" width="8" height="10" rx="1" fill="none" stroke="currentColor"/><rect x="13" y="5" width="8" height="10" rx="1" fill="none" stroke="currentColor"/>'], [3, '<rect x="3" y="5" width="10" height="10" rx="1" fill="none" stroke="currentColor"/><rect x="15" y="5" width="6" height="4" rx="1" fill="none" stroke="currentColor"/><rect x="15" y="11" width="6" height="4" rx="1" fill="none" stroke="currentColor"/>'], [4, '<rect x="3" y="4" width="8" height="5" rx="1" fill="none" stroke="currentColor"/><rect x="13" y="4" width="8" height="5" rx="1" fill="none" stroke="currentColor"/><rect x="3" y="11" width="8" height="5" rx="1" fill="none" stroke="currentColor"/><rect x="13" y="11" width="8" height="5" rx="1" fill="none" stroke="currentColor"/>']];
const lock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function paintLays() { $('lays').innerHTML = LAYS.map(([n, svg]) => `<button class="lay" data-l="${n}" aria-pressed="${n === S.layout}" aria-label="${n} screen${n > 1 ? 's' : ''}"><svg viewBox="0 0 24 20" style="width:30px;height:24px">${svg}</svg>${n > FREE_SCREENS ? `<span class="pro">${lock}PRO</span>` : ''}</button>`).join(''); }
$('lays').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; const n = +b.dataset.l; if (n > FREE_SCREENS) { $('menu').classList.remove('on'); pro('screens'); return; } S.layout = n; paintLays(); closeCard(); buildScreens(); };
$('shot').onclick = async () => {
  $('menu').classList.remove('on');
  try {
    const W = innerWidth, H = innerHeight, c = document.createElement('canvas'), d = Math.min(2, devicePixelRatio || 1); c.width = W * d; c.height = H * d; const x = c.getContext('2d'); x.scale(d, d); x.fillStyle = '#070708'; x.fillRect(0, 0, W, H);
    for (const f of frames()) { const r = f.getBoundingClientRect(); for (const cv of f.contentDocument.querySelectorAll('canvas')) { const cr = cv.getBoundingClientRect(); if (cr.width > 50) x.drawImage(cv, r.left + cr.left, r.top + cr.top, cr.width, cr.height); } }
    x.fillStyle = 'rgba(255,255,255,.75)'; x.font = '600 14px Inter, sans-serif'; x.fillText('Investedia · investedia.com', 18, H - 18);
    const a = document.createElement('a'); a.download = 'investedia-globe.png'; a.href = c.toDataURL('image/png'); a.click(); toast('Screenshot saved');
  } catch (e) { toast('Screenshot is not available here'); }
};
$('share').onclick = async () => { $('menu').classList.remove('on'); try { await navigator.clipboard.writeText(location.href); toast('Link copied'); } catch (e) { toast(location.href); } };
function paintPerf() { $('perfTg').classList.toggle('on', S.perf); $('perf').setAttribute('aria-checked', String(S.perf)); }
$('perf').onclick = () => { S.perf = !S.perf; store('inv-globe-perf', S.perf ? '1' : '0'); paintPerf(); closeCard(); buildScreens(); toast(S.perf ? 'Performance mode on' : 'Performance mode off'); };

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">${[['Capacity', v ? Math.round(v).toLocaleString('en-US') + ' MW' : 'Not listed'], ['Rank', rank ? '#' + rank + ' of ' + R.length.toLocaleString('en-US') : '—']].map(([a, b]) => `<div style="padding:10px;border:1px solid var(--ln);border-radius:10px"><div class="m3" style="font-size:11px">${a}</div><b>${b}</b></div>`).join('')}</div>
    ${p.validation_status !== 'verified' ? '<p style="margin-top:8px;font-size:11.5px">Not yet verified in our source data.</p>' : ''}
    <div class="act"><a href="/news?q=${encodeURIComponent(p.n)}">Related news</a><button class="btn glass" id="plines" style="height:40px">Company lines <span class="pro">PRO</span></button></div>
    <div class="src">Source: <a href="${esc((p.src && p.src[0] && p.src[0].url) || 'https://www.wikidata.org')}" target="_blank" rel="noopener" style="color:inherit">Wikidata</a> · Not investment advice</div>`;
  $('card').classList.add('on'); document.body.classList.add('card'); dragged = null; const c = $('card'); if (innerWidth > 820) { c.style.left = (innerWidth - 700) + 'px'; c.style.top = '118px'; }
  $('plines').onclick = () => pro('lines'); }
// A + D (owner 28 Nov 2026): zoomed out = one count badge per country; zoomed in = icon pins (white glyph per type)
const PG = { 'Hydro energy': '<path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/>', 'Wind energy': '<path d="M12 12v9M12 12L6 8M12 12l6-4M12 12V4"/>', 'Nuclear energy': '<circle cx="12" cy="12" r="2"/><path d="M12 4v4M5 16l3.5-2M19 16l-3.5-2"/>', 'Solar energy': '<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>', 'Data centres': '<rect x="5" y="4" width="14" height="6" rx="1"/><rect x="5" y="14" width="14" height="6" rx="1"/>', 'Real estate': '<path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/>', 'High-speed rail': '<rect x="6" y="3" width="12" height="14" rx="3"/><path d="M8 21l2-4M16 21l-2-4M6 11h12"/>', 'Megaproject': '<path d="M12 3l9 16H3z"/>' };
$('plegend').innerHTML = ['Hydro energy', 'Wind energy', 'Nuclear energy', 'Solar energy', 'Data centres'].map(k => `<span style="display:flex;gap:5px;align-items:center"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round">${PG[k]}</svg>${PT[k][0]}</span>`).join('') + '<span class="m3">Zoom in for each project</span>';
const PZ = 2.3; let PMODE = '';
function projLoop() {
  const box = $('proj');
  if (S.mode !== 'projects') { if (box.childElementCount) { box.innerHTML = ''; PMODE = ''; } requestAnimationFrame(projLoop); return; }
  const fr = document.querySelector('.pane.on iframe') || frames()[0], w = fr && fr.contentWindow;
  if (!w || !w.InvGlobeXY) { requestAnimationFrame(projLoop); return; }
  const r = fr.getBoundingClientRect(), z = w.InvGlobeView()[2], mode = (z < PZ ? 'c' : 'i') + P.type;
  let L;
  if (z < PZ) {  // D: count per country, at the average position of its projects
    const g = {}; for (const p of projList()) { const k = p.c; (g[k] = g[k] || { n: 0, la: 0, lo: 0, c: k }); g[k].n++; g[k].la += p.la; g[k].lo += p.lo; }
    L = Object.values(g).map(o => ({ c: o.c, n: o.n, la: o.la / o.n, lo: o.lo / o.n })).sort((a, b) => b.n - a.n).slice(0, 120);
    if (PMODE !== mode) box.innerHTML = L.map(o => `<i data-pc="${esc(o.c)}" title="${esc(o.c)} · ${o.n} projects" style="width:${o.n > 99 ? 34 : 28}px;height:28px;border-radius:999px;display:grid;place-items:center;font:700 11px Inter,sans-serif;color:#fff;background:#18181b;border:1.5px solid rgba(255,255,255,.55)">${o.n}</i>`).join('');
  } else {  // A: icon pins, largest first
    L = projList().filter(p => mw(p) || p.t !== 'Hydro energy').sort((a, b) => (mw(b) || 0) - (mw(a) || 0)).slice(0, 500);
    if (PMODE !== mode) box.innerHTML = L.map(p => `<i data-pk="${esc(p.k)}" title="${esc(p.n)}${mw(p) ? ' · ' + Math.round(mw(p)).toLocaleString('en-US') + ' MW' : ''}" style="width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:rgba(18,18,21,.88);border:1px solid rgba(255,255,255,.3)"><svg viewBox="0 0 24 24" style="width:13px;height:13px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round">${PG[p.t] || PG['Megaproject']}</svg></i>`).join('');
  }
  PMODE = mode;
  // biggest first; anything that would overlap an already shown marker is hidden (clean, no pile-ups)
  const els = box.children, gap = z < PZ ? 32 : 26, shown = [];
  for (let i = 0; i < L.length; i++) { const v = w.InvGlobeXY(L[i].la, L[i].lo), e = els[i]; if (!e) break;
    if (!v || v[2] <= 0.05) { e.style.display = 'none'; continue; } const x = r.left + v[0], y = r.top + v[1];
    if (shown.some(q => Math.abs(q[0] - x) < gap && Math.abs(q[1] - y) < gap)) { e.style.display = 'none'; continue; }
    shown.push([x, y]); e.style.display = ''; e.style.left = x + 'px'; e.style.top = y + 'px'; }
  requestAnimationFrame(projLoop);
}
$('proj').addEventListener('click', e => { const c = e.target.closest('[data-pc]'); if (!c) return; const L = projList().filter(p => p.c === c.dataset.pc); const w = activeWin(); camIn(w);
  const la = L.reduce((a, p) => a + p.la, 0) / L.length, lo = L.reduce((a, p) => a + p.lo, 0) / L.length; try { w.flyTo(lo, la, 3.2, 1100); } catch (x) {}
  const t = {}; L.forEach(p => t[p.t] = (t[p.t] || 0) + 1);
  $('cb').innerHTML = `<div class="k">Projects</div><h3>${esc(c.dataset.pc)}</h3><p>${L.length} projects</p><div style="margin-top:8px">${Object.entries(t).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<div class="row"><span>${esc((PT[k] || [k])[0])}</span><span>${n}</span></div>`).join('')}</div><div class="src">Zoom in to see each project · Source: Wikidata</div>`;
  const cd = $('card'); cd.classList.remove('in'); void cd.offsetWidth; cd.classList.add('on', 'in'); document.body.classList.add('card'); if (innerWidth > 820) { cd.style.left = '76px'; cd.style.top = '118px'; } });
$('proj').addEventListener('click', e => { const b = e.target.closest('[data-pk]'); if (b) openProject(P.all.find(p => p.k === b.dataset.pk)); });
requestAnimationFrame(projLoop);

// ---------- alerts (Pro): from the story card, and an area on the map ----------
function alertBlock(s) { const it = [...new Set([...(s.impacts || []).slice(0, 2).map(i => i.name), s.location?.country, s.category].filter(Boolean))];
  return `<button class="btn glass" id="abtn" style="height:40px;width:44px;padding:0" aria-label="Alerts" title="Alerts">${BELL}</button><div id="alrt"><div class="k" style="margin-bottom:4px">Alert me about</div>${it.map(x => `<div class="row"><span>${esc(x)}</span><button aria-label="Alert for ${esc(x)}"></button></div>`).join('')}<div class="m3" style="font-size:11px;margin-top:6px">Push · email · Pro</div></div>`; }


// ---------- camera: remember the view before zooming in, fly back when the card closes ----------
const CAM = { prev: null };
function camIn(w) { if (CAM.prev) return; try { CAM.prev = { w, v: w.InvGlobeView() }; } catch (e) {} }
function camBack() { const p = CAM.prev; CAM.prev = null; if (!p) return; try { p.w.InvGlobeClear(); p.w.flyTo(p.v[0], p.v[1], p.v[2], 900); } catch (e) {} }
function focusStory(s, w) { camIn(w); try { const v = w.InvGlobeView(); w.InvGlobeSelect(s.id, s.location?.country); w.flyTo(s.location.lon, s.location.lat, Math.max(v[2], 2.4), 1000); } catch (e) {} }

// phone: tap the sheet handle to expand/collapse the feed; timeline behind a button
$('feed').addEventListener('click', e => { if (innerWidth > 820) return; const r = $('feed').getBoundingClientRect(); if (e.clientY - r.top < 22) $('feed').classList.toggle('big'); });
$('tlBtn').onclick = () => document.body.classList.toggle('tl');
// ---------- start ----------
if (store('inv-app-feed') === 'cards') document.querySelector('[data-fs="cards"]').click();
S.layout = Math.min(FREE_SCREENS, Math.max(1, +Q.get('layout') || 1)); paintLays(); paintPerf(); buildScreens(); setDays(2);
Promise.all([fetch('news-live.json', { cache: 'no-cache' }).then(r => r.json()), fetch('news-prices.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => ({ assets: {} }))]).then(([n, p]) => {
  S.stories = (n.stories || []).filter(s => s.location && Number.isFinite(s.location.lat)); S.byId = Object.fromEntries(S.stories.map(s => [s.id, s]));
  // only prices from the last 2 days count (the daily file can be stale); fresher moves come from the prices API (delayed, not live)
  S.prices = (Date.now() - Date.parse(p.asof || 0) < 2 * 864e5) ? (p.assets || {}) : {};
  renderTab();
  Promise.all([fetch(((window.INV_CONFIG && INV_CONFIG.apiBaseUrl) || 'https://api.investedia.com') + '/v1/prices?group=all').then(r => { if (!r.ok) throw 0; return r.json(); }), fetch('price-map.json').then(r => r.json()).catch(() => ({ map: {} }))]).then(([j, pm]) => {
    const inv = {}; for (const [k, v] of Object.entries(pm.map || {})) inv[v] = k; let n = 0;
    for (const im of S.stories.flatMap(s => s.impacts || [])) { const t = im.ticker || (im.asset && im.asset.px); if (!t) continue; const v = j.data && (j.data[t] || j.data[inv[t]]); if (Array.isArray(v) && isFinite(v[1]) && Date.now() - (v[2] || 0) < 2 * 864e5) { S.prices[t] = { d: Math.round(v[1] * 100) / 100, p: v[0] }; n++; } }
    if (n) renderTab();
  }).catch(() => {});
  const cq = Q.get('country'); if (cq) { const f = frames()[0]; const go = () => { try { f.contentWindow.InvGlobeNav.country(cq); } catch (e) {} }; f.contentWindow?.InvGlobeNav ? setTimeout(go, 800) : f.addEventListener('load', () => setTimeout(go, 1200), { once: true }); }
  const id = Q.get('story'); if (id && S.byId[id]) { const f = frames()[0]; const go = () => { try { f.contentWindow.flyTo(S.byId[id].location.lon, S.byId[id].location.lat, 2.4); } catch (e) {} openStory(S.byId[id], f.contentWindow); }; if (f.contentWindow?.InvGlobeXY) go(); else f.addEventListener('load', () => setTimeout(go, 600), { once: true }); }
}).catch(() => { $('list').innerHTML = '<p class="m3" style="padding:14px">News is loading. Please refresh in a moment.</p>'; });
})();
