<main class="wrap" id="main-content" tabindex="-1">
<div class="page-head">
  <div class="crumbs"><a href="index.html">Home</a><span>/</span><span>Design studio</span></div>
  <div class="sec-head" style="margin:0"><div><h1>Design studio</h1><p class="lede">Change any option and the whole page updates instantly. Pick what you like, then copy your choices and send them over.</p></div></div>
</div>

<section class="sec studio">
  <div class="studio-grid">
    <aside class="card studio-panel" aria-label="Design options">
      <div class="card-head st-head"><button class="st-grab" type="button" id="st-min" aria-expanded="true"><h3>Options</h3><span class="st-hint">Tap to hide</span></button><button class="btn btn-ghost btn-sm" type="button" id="st-reset">Reset</button></div>
      <div class="card-pad" id="st-opts"></div>
      <div class="card-pad studio-foot">
        <label class="st-switch"><input type="checkbox" id="st-apply"><span class="st-track"><i></i></span><span><b>Use on the whole site</b><small>Only on this device, so you can browse with it</small></span></label>
        <button class="btn btn-primary" type="button" id="st-copy" style="width:100%">Copy my choices</button>
        <p class="dim" id="st-copied" style="margin:0;font-size:12.5px;min-height:18px"></p>
      </div>
    </aside>

    <div class="studio-preview">
      <div class="sec-head"><div><h2>Trending markets</h2><p>A live preview built from the site's real parts.</p></div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
        <div class="tabs" id="pv-tabs"><button class="tab" type="button" aria-pressed="true">Gainers</button><button class="tab" type="button" aria-pressed="false">Losers</button><button class="tab" type="button" aria-pressed="false">Biggest moves</button></div>
        <select class="select sel-sm" id="pv-sel" aria-label="Sector"><option>All sectors</option><option>Technology</option><option>Finance</option><option>Healthcare</option><option>Energy</option></select>
      </div>
      <div class="chips-row" id="pv-chips"><button class="chip on" type="button">All markets</button><button class="chip" type="button">Stocks</button><button class="chip" type="button">Crypto</button><button class="chip" type="button">Indices</button></div>
      <div class="grid g-3" id="pv-cards"></div>

      <div class="grid g-2" style="margin-top:20px">
        <div class="card"><div class="card-head"><div class="ident" id="pv-ident"></div><div class="range" id="pv-range"><button type="button" aria-pressed="false">1M</button><button type="button" aria-pressed="true">1Y</button><button type="button" aria-pressed="false">5Y</button></div></div><div style="padding:8px 8px 4px 16px"><div id="pv-chart"></div></div></div>
        <div class="card"><div class="card-head"><h3>Rising today</h3><span class="meta">real prices</span></div><div id="pv-rows"></div></div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:20px">
        <button class="btn btn-primary" type="button">Open dashboard</button>
        <button class="btn btn-ghost" type="button">Discover Investedia</button>
        <input class="input" style="max-width:240px" placeholder="you@email.com" aria-label="Email preview">
      </div>
    </div>
  </div>
</section>

<script>
const { logo, href, fmtP, fmtC, cls, spark, colorFor, areaChart, applyStudio, STUDIO_DEF } = UI, M = MOCK;
const OPTS = [
  ['accent', 'Accent colour', [['#FF7A1A', 'Orange'], ['#F5A524', 'Amber'], ['#3B82F6', 'Blue'], ['#10B981', 'Green'], ['#8B5CF6', 'Violet'], ['#E5E7EB', 'Silver']]],
  ['corners', 'Corners', [['sharp', 'Sharp'], ['medium', 'Medium'], ['soft', 'Soft']]],
  ['size', 'Text size', [['compact', 'Compact'], ['default', 'Default'], ['large', 'Large']]],
  ['font', 'Font', [['inter', 'Inter'], ['geist', 'Geist'], ['system', 'System']]],
  ['numbers', 'Numbers', [['mono', 'Monospace'], ['sans', 'Same as text']]],
  ['cards', 'Cards', [['bordered', 'Outlined'], ['elevated', 'Shadow'], ['flat', 'Flat']]],
  ['icons', 'Title icons', [['box', 'In a box'], ['plain', 'Plain'], ['off', 'Off']]],
  ['dropdown', 'Phone dropdowns', [['sheet', 'Bottom sheet'], ['popover', 'Small menu']]],
  ['motion', 'Animations', [['full', 'Smooth'], ['reduced', 'Minimal']]],
];
let cfg = Object.assign({}, STUDIO_DEF);
try { Object.assign(cfg, JSON.parse(localStorage.getItem('inv-studio') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('inv-studio', JSON.stringify(cfg)); } catch {} };

function drawOpts() {
  document.getElementById('st-opts').innerHTML = OPTS.map(([k, label, list]) => `<div class="st-row"><span class="st-label">${label}</span>${k === 'accent'
    ? `<div class="st-swatches">${list.map(([v, n]) => `<button type="button" class="st-sw" style="--sw:${v}" aria-label="${n}" aria-pressed="${cfg.accent.toLowerCase() === v.toLowerCase()}" data-k="accent" data-v="${v}"></button>`).join('')}<label class="st-sw st-custom" aria-label="Custom colour" style="--sw:${cfg.accent}"><input type="color" value="${cfg.accent}" id="st-color"></label></div>`
    : `<div class="tabs st-tabs">${list.map(([v, n]) => `<button class="tab" type="button" aria-pressed="${cfg[k] === v}" data-k="${k}" data-v="${v}">${n}</button>`).join('')}</div>`}</div>`).join('');
  document.getElementById('st-color').oninput = e => set('accent', e.target.value);
}
function set(k, v) { cfg[k] = v; applyStudio(cfg); save(); if (k === 'accent') { drawOpts(); drawPreview(); } else document.querySelectorAll(`[data-k="${k}"]`).forEach(b => b.setAttribute(b.classList.contains('tab') ? 'aria-pressed' : 'aria-pressed', b.dataset.v === v)); }
document.getElementById('st-opts').addEventListener('click', e => { const b = e.target.closest('[data-k]'); if (b) set(b.dataset.k, b.dataset.v); });

const ap = document.getElementById('st-apply'); ap.checked = !!cfg.apply;
ap.onchange = () => { cfg.apply = ap.checked; save(); };
document.getElementById('st-reset').onclick = () => { const keep = cfg.apply; cfg = Object.assign({}, STUDIO_DEF, { apply: keep }); applyStudio(cfg); save(); drawOpts(); drawPreview(); };
document.getElementById('st-copy').onclick = async () => {
  const txt = 'Investedia look: ' + OPTS.map(([k, label, list]) => `${label}: ${(list.find(([v]) => v.toLowerCase() === String(cfg[k]).toLowerCase()) || [0, cfg[k]])[1]}`).join(' · ');
  let ok = false; try { await navigator.clipboard.writeText(txt); ok = true; } catch {}
  document.getElementById('st-copied').textContent = ok ? 'Copied. Paste it in the chat.' : txt;
};

// Preview built from real assets and prices
function drawPreview() {
  const picks = ['NVDA', 'BTC', 'ASML'].map(s => M.bySym[s]);
  document.getElementById('pv-cards').innerHTML = picks.map(a => `<a class="card idx" href="${href(a)}"><div class="idx-top"><span class="ident">${logo(a)}<span><b style="color:var(--fg)">${a.s}</b><small>${a.n}</small></span></span><span class="pill ${cls(a.d)}">${fmtC(a.d)}</span></div><div class="idx-val" data-lp="${a.s}">${fmtP(a)}</div>${spark(a.spark, colorFor(a.d))}</a>`).join('');
  const up = M.assets.filter(a => a.c === 'stocks' && a.d > 0).sort((x, y) => y.d - x.d).slice(0, 4);
  document.getElementById('pv-rows').innerHTML = up.map(a => `<a class="arow" href="${href(a)}" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="ident">${logo(a)}<span><b>${a.s}</b><small>${a.n}</small></span></span><span class="num">${fmtP(a)}</span><span class="num ${cls(a.d)}" style="min-width:64px;text-align:right">${fmtC(a.d)}</span></a>`).join('');
  const spx = M.bySym.SPX; document.getElementById('pv-ident').innerHTML = `${logo(spx)}<span><b>S&amp;P 500</b><small>${fmtP(spx)}</small></span>`;
  M.history('SPX', '1Y').then(r => areaChart(document.getElementById('pv-chart'), r ? r.vals : M.series('SPXst', 120, spx.p, 14), { height: 200, labels: r ? r.labels : [], fmt: v => v.toLocaleString('en-US', { maximumFractionDigits: 0 }) }));
}
document.querySelectorAll('#pv-tabs .tab').forEach(b => b.onclick = () => document.querySelectorAll('#pv-tabs .tab').forEach(x => x.setAttribute('aria-pressed', x === b)));
document.querySelectorAll('#pv-range button').forEach(b => b.onclick = () => document.querySelectorAll('#pv-range button').forEach(x => x.setAttribute('aria-pressed', x === b)));
document.querySelectorAll('#pv-chips .chip').forEach(b => b.onclick = () => document.querySelectorAll('#pv-chips .chip').forEach(x => x.classList.toggle('on', x === b)));

const panel = document.querySelector('.studio-panel'), mb = document.getElementById('st-min');
mb.onclick = () => { const min = panel.classList.toggle('min'); mb.setAttribute('aria-expanded', !min); mb.querySelector('.st-hint').textContent = min ? 'Tap to show' : 'Tap to hide'; };
applyStudio(cfg); drawOpts(); drawPreview();
</script>
</main>
