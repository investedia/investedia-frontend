# Deploy the built site to Cloudflare Pages from GitHub Actions.
# Replaces Cloudflare's own Git connection (broken, and over its 500 builds/month).
# The repo stays private: only the public website files below are uploaded.
# Public live settings (API address, Supabase URL and publishable key) are written below, as the old Cloudflare build did.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'tests/**'
      - '.github/review/**'
  workflow_dispatch: {}

# A burst of merges becomes one deploy: a newer push cancels the deploy still running.
concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect the public site (no source, tests, tools or GitHub Pages copy)
        run: |
          mkdir -p site
          tar -cf - \
            --exclude='./.git' --exclude='./.github' --exclude='./site' \
            --exclude='./docs' --exclude='./tests' --exclude='./tools' --exclude='./src' \
            --exclude='./scripts' --exclude='./config' --exclude='./graphify-out' --exclude='./functions' \
            --exclude='*.md' --exclude='*.py' --exclude='./package.json' \
            --exclude='./.gitignore' --exclude='./.nojekyll' . | tar -xf - -C site
          files=$(find site -type f | wc -l)
          big=$(find site -type f -size +25M | wc -l)
          echo "Files: $files  (Cloudflare limit 20000)  Over 25 MB: $big"
          test "$files" -le 20000
          test "$big" -eq 0
          test -f site/index.html

      - name: Fingerprint the collected article catalog for Cloudflare readers
        run: python3 tools/news_library_index.py --fingerprint site

      - name: Write the public live settings (live news, prices, login)
        env:
          INV_API_BASE_URL: https://api.investedia.com
          INV_SUPABASE_URL: https://lfjyoeusblhfpmgwbrhj.supabase.co
          INV_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kqozWiWcKHNqendoiWxsMA_ro7DfTQF
          INV_ANALYTICS_ENABLED: 'false'
        run: |
          python3 -c "import sys; sys.path.insert(0, 'scripts'); from runtime_config import build_config, runtime_script; open('site/assets/runtime-config.js', 'wb').write(runtime_script(build_config()))"
          grep -q '"dataMode": "worker"' site/assets/runtime-config.js
          cat site/assets/runtime-config.js

      - name: New offline-cache version on every deploy (browsers drop old code)
        run: |
          sed -i -E "s/const VERSION = '[^']*'/const VERSION = '${GITHUB_SHA::10}'/" site/sw.js
          grep -q "const VERSION = '${GITHUB_SHA::10}'" site/sw.js

      - name: Upload to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3 pages deploy site \
            --project-name "${{ vars.CF_PAGES_PROJECT || 'investedia' }}" \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true
