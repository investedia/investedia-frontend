# Refreshes the ECB reference rates used by the Markets country panel and opens a PR.
# Runs every weekday after the ECB publishes (owner approved 10 Nov 2026), and by hand. No secrets.
name: Country data refresh (ECB rates)
on:
  workflow_dispatch:
    inputs:
      economy_history:
        description: Produce a reviewed World Bank history artifact
        type: boolean
        default: false
  schedule:
    - cron: '12 6 * * 0'  # weekly World Bank history artifact only
    - cron: '37 15 * * 1-5'  # after the ECB publishes (~16:00 CET)
permissions:
  contents: write
concurrency:
  group: country-data
  cancel-in-progress: false
jobs:
  ecb:
    if: github.event.schedule != '12 6 * * 0' && !inputs.economy_history
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ECB reference rates (keeps previous file on failure)
        run: python scripts/fx_ecb.py
      - name: Commit the new rates (data files only)
        run: |
          if git diff --quiet -- assets/globe/fx-ecb.json docs/assets/globe/fx-ecb.json; then echo "No change"; exit 0; fi
          if [ -n "$(git status --porcelain | grep -v 'assets/globe/fx-ecb.json')" ]; then echo "::error::Unexpected changes; refusing to commit"; exit 1; fi
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/globe/fx-ecb.json docs/assets/globe/fx-ecb.json
          git commit -m "Data: ECB reference rates $(jq -r .as_of assets/globe/fx-ecb.json)"
          git push origin HEAD:main

  economy-history:
    if: github.event.schedule == '12 6 * * 0' || inputs.economy_history
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_economy_history.py'
      - run: python scripts/economy_history.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: economy-history-${{ github.run_id }}
          path: out/
          retention-days: 30
