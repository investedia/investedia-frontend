name: Frontend checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/article-r2-reader.test.mjs tests/article-index-r2-reader.test.mjs tests/data-snapshot-r2-reader.test.mjs tests/calendar-live-reader.test.mjs
