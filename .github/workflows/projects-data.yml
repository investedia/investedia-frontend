name: Projects registry (manual artifact)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: projects-registry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_projects_data.py'
      - run: python tools/projects_data.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: projects-registry-${{ github.run_id }}
          path: out/projects/
          retention-days: 30
